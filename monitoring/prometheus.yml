global:
  scrape_interval: 15s

scrape_configs:
  - job_name: financeme-test
    static_configs:
      - targets: ["TEST_SERVER_IP:9100"]
        labels: { environment: test }
  - job_name: financeme-prod
    static_configs:
      - targets: ["PROD_SERVER_IP:9100"]
        labels: { environment: prod }
